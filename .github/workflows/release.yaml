name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: climate-resource/github-actions/setup-uv@6c74f819303d8cd1c65643a90de8dcdc248a03b5 # v1.10.0
        with:
          python-version: "3.13"
      - run: uv build
      - name: Check the built wheel imports
        run: uv run --isolated --no-project --with dist/*.whl python -c "import cr_service.auth.testing"
      - run: uv publish --trusted-publishing always
